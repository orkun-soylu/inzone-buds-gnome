# Pins the INZONE Buds dongle to the Pro Audio profile.
#
# WHY: the dongle exposes two playback PCMs -- hw:N,0 is the game stream, hw:N,1
# the chat stream. The earbuds mix the two with a balance setting (vendor HCI
# 0x22 GAME_CHAT_MIX_BALANCE). ALSA's default ACP profiles open only ONE sink
# (output:iec958-stereo), so no application can be routed to the chat stream
# and the balance setting degrades into a "turn everything down" control.
#
# The "pro-audio" profile opens both PCMs as separate sinks:
#   alsa_output.usb-Sony_INZONE_Buds-00.pro-output-0  -> hw:N,0  game
#   alsa_output.usb-Sony_INZONE_Buds-00.pro-output-1  -> hw:N,1  chat
#
# Selecting it by hand with wpctl set-profile is NOT enough: after the dongle is
# unplugged and replugged WirePlumber returns to the iec958 profile (measured).
#
# To remove: make wireplumber-uninstall

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.usb-Sony_INZONE_Buds-00"
      }
    ]
    actions = {
      update-props = {
        api.acp.auto-profile = false
        device.profile       = "pro-audio"
      }
    }
  }
]
