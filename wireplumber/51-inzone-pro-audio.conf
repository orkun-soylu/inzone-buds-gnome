# INZONE Buds dongle'ini Pro Audio profiline sabitler.
#
# NEDEN: dongle iki playback PCM'i sunuyor -- hw:2,0 oyun akisi, hw:2,1 sohbet
# akisi. Kulaklikta bu ikisini karistiran bir denge ayari var (vendor HCI
# 0x22 GAME_CHAT_MIX_BALANCE). ALSA'nin varsayilan ACP profilleri yalnizca
# TEK sink aciyor (output:iec958-stereo), dolayisiyla sohbet akisina hicbir
# uygulama yonlendirilemiyor ve denge ayari pratikte "her seyi kis"
# dugmesine donusuyor.
#
# "pro-audio" profili iki PCM'i de ayri sink olarak acar:
#   alsa_output.usb-Sony_INZONE_Buds-00.pro-output-0  -> hw:2,0  oyun
#   alsa_output.usb-Sony_INZONE_Buds-00.pro-output-1  -> hw:2,1  sohbet
#
# wpctl set-profile ile elle secmek YETMIYOR: dongle cikarilip takilinca
# WirePlumber iec958 profiline geri donuyor (olculdu 2026-09-03).
#
# Kaldirmak icin: make wireplumber-uninstall

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.usb-Sony_INZONE_Buds-00"
      }
    ]
    actions = {
      update-props = {
        api.acp.auto-profile = false
        device.profile       = "pro-audio"
      }
    }
  }
]
